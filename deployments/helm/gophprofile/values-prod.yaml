
image:
  repository: registry.example.com/gophprofile
  tag: "1.0.0"
  pullPolicy: IfNotPresent

server:
  replicas: 3
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi

worker:
  replicas: 2

app:
  logLevel: info
  s3Endpoint: s3.example.com
  s3UseSSL: true
  kafkaBrokers: kafka.example.com:9092
  traceSampleRate: "0.1"

ingress:
  host: avatars.example.com

autoscaling:
  minReplicas: 3
  maxReplicas: 10

serviceMonitor:
  enabled: true

postgres:
  enabled: false

kafka:
  enabled: false

minio:
  enabled: false
