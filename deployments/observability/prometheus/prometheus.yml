global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [ "localhost:9090" ]
  - job_name: otel-collector-apps
    honor_labels: true
    static_configs:
      - targets: [ "otel-collector:8889" ]

    metric_relabel_configs:
      - regex: "otel_scope_.*"
        action: labeldrop
