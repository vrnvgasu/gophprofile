name: 'gophprofile'

services:
  postgres:
    container_name: gophprofile-postgres
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: "gophprofile"
      POSTGRES_USER: "gophprofile"
      POSTGRES_PASSWORD: "gophprofile"
    ports:
      - "5432:5432"
    restart: unless-stopped
    volumes:
      - gophprofile-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U gophprofile" ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - gophprofile-network

  minio:
    container_name: gophprofile-minio
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: "minioadmin"
      MINIO_ROOT_PASSWORD: "minioadmin"
    ports:
      - "9000:9000"
      - "9001:9001"
    restart: unless-stopped
    volumes:
      - gophprofile-minio:/data
    healthcheck:
      test: [ "CMD", "mc", "ready", "local" ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - gophprofile-network

  # Kafka в режиме KRaft: отдельный ZooKeeper не нужен.
  kafka:
    container_name: gophprofile-kafka
    image: apache/kafka:3.9.1
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1" ]
      interval: 10s
      timeout: 10s
      retries: 10
    networks:
      - gophprofile-network

  server:
    container_name: gophprofile-server
    build:
      context: ..
      dockerfile: Dockerfile
    command: [ "/app/server" ]
    environment: &app-env
      RUN_ADDRESS: ":8080"
      DATABASE_URI: "postgres://gophprofile:gophprofile@postgres:5432/gophprofile?sslmode=disable"
      LOG_LEVEL: "info"
      STATIC_DIR: "/app/web/static"
      MAX_UPLOAD_SIZE: "10485760"
      S3_ENDPOINT: "minio:9000"
      S3_ACCESS_KEY: "minioadmin"
      S3_SECRET_KEY: "minioadmin"
      S3_BUCKET: "avatars"
      S3_USE_SSL: "false"
      KAFKA_BROKERS: "kafka:9092"
      KAFKA_TOPIC: "avatar-events"
      KAFKA_GROUP_ID: "avatar-worker"
    ports:
      - "8080:8080"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - gophprofile-network

  worker:
    container_name: gophprofile-worker
    build:
      context: ..
      dockerfile: Dockerfile
    command: [ "/app/worker" ]
    environment: *app-env
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - gophprofile-network

networks:
  gophprofile-network:
    driver: bridge

volumes:
  gophprofile-pgdata:
  gophprofile-minio:
